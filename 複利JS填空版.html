<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>JS 複利計算填空版</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8f9fa; padding: 20px; }
        .box { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h3 { text-align: center; color: #333; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        
        /* 動畫準備 */
        #res { 
            margin-top: 15px; 
            padding: 15px; 
            background: #e9f7ef; 
            border-left: 5px solid #28a745; 
            display: none; 
            line-height: 1.8; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
        }
        
        /* 當 JS 加入此 class 時觸發淡入 */
        #res.show { 
            display: block !important; 
            opacity: 1; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>💰 紅利試算 (JS 填空版)</h3>
        <input type="number" id="base" value="1000000">
        <input type="number" id="rate" value="5">
        <input type="number" id="year" value="3">
        <button onclick="run()">開始計算</button>
        <div id="res"></div>
    </div>

    <script>
        function run() {
            var resDiv = document.getElementById("res");
            // 重設畫面
            resDiv.classList.remove("show");
            resDiv.style.display = "none";

            var b = parseFloat(document.getElementById("base").value);
            var r = parseFloat(document.getElementById("rate").value);
            var y = parseInt(document.getElementById("year").value);

            var records = []; 
            var temp_b = b;
            var total_p = 0;
            var total_list = "";

            for (var i = 1; i <= y; i++) {
                var p = Math.round(temp_b * (r / 100));
                
                // TODO 1: 使用 push 將收益 p 存入陣列記錄
                /* 這裡請學員填寫 */
                total_p += p;
                temp_b += p;

                // TODO 2: 拼接年度明細字串 (第 i 年：p 元)
                /* total_list = total_list + '第' + ______ + '年：' + ______ +'元<br>'; */
            }

            // TODO 3: 在 Console 印出陣列觀察
            /* console.log(______); */

            resDiv.innerHTML = total_list + 
                            "<br><b>累積總收益：$" + total_p.toLocaleString() + "</b><hr>" +
                            "第一年獲益：$" + records[0].toLocaleString() + "<br>" +
                            "最後一年獲益：$" + records[/* TODO 4: 抓取最後一筆索引 */].toLocaleString();

            resDiv.style.display = "block"; 
            // TODO 5: 練習 setTimeout 延遲觸發淡入動畫
            setTimeout(function() {
                /* resDiv.classList.______( "show" ); */
            }, 20); 
        }
    </script>
</body>
</html>
